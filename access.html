<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access Request | ZeroTrust AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            ZeroTrust<span>AI</span>
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="index.html#how-it-works">
                How It Works
            </a>
            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>


    <main class="access-container">

        <div class="page-heading">

            <div class="badge">
                ZERO TRUST ACCESS
            </div>

            <h1>
                Request Access
            </h1>

            <p>
                Every request is evaluated based on multiple security
                and behavioral factors.
            </p>

        </div>


        <form id="accessForm">


            <!-- USER -->

            <section class="form-section">

                <h2>👤 User Information</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>User ID</label>

                        <input
                            type="text"
                            id="userId"
                            placeholder="USER1024"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Department</label>

                        <select id="department" required>

                            <option value="">
                                Select Department
                            </option>

                            <option>IT</option>
                            <option>HR</option>
                            <option>Finance</option>
                            <option>Management</option>
                            <option>Operations</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Role</label>

                        <select id="role" required>

                            <option value="">
                                Select Role
                            </option>

                            <option>Employee</option>
                            <option>Manager</option>
                            <option>Administrator</option>

                        </select>

                    </div>

                </div>

            </section>


            <!-- DEVICE -->

            <section class="form-section">

                <h2>💻 Device Information</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Device Type</label>

                        <select id="device" required>

                            <option value="">
                                Select Device
                            </option>

                            <option>Laptop</option>
                            <option>Desktop</option>
                            <option>Mobile</option>
                            <option>Tablet</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Operating System</label>

                        <select id="os" required>

                            <option value="">
                                Select OS
                            </option>

                            <option>Windows</option>
                            <option>Linux</option>
                            <option>macOS</option>
                            <option>Android</option>
                            <option>iOS</option>

                        </select>

                    </div>

                </div>

            </section>


            <!-- ACCESS -->

            <section class="form-section">

                <h2>🔐 Access Information</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Requested Resource</label>

                        <input
                            type="text"
                            id="resource"
                            placeholder="Company Database"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Resource Sensitivity</label>

                        <select id="sensitivity" required>

                            <option value="">
                                Select Sensitivity
                            </option>

                            <option value="Low">
                                Low
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="High">
                                High
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Login Time</label>

                        <input
                            type="time"
                            id="loginTime"
                            required
                        >

                    </div>

                </div>

            </section>


            <!-- SECURITY -->

            <section class="form-section">

                <h2>⚠️ Security Information</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Failed Login Attempts</label>

                        <input
                            type="number"
                            id="failedAttempts"
                            min="0"
                            max="20"
                            value="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Previous Activity</label>

                        <select id="activity" required>

                            <option value="">
                                Select Activity
                            </option>

                            <option value="Normal">
                                Normal
                            </option>

                            <option value="Unusual">
                                Unusual
                            </option>

                            <option value="Suspicious">
                                Suspicious
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Current Location</label>

                        <input
                            type="text"
                            id="location"
                            placeholder="Dehradun"
                            required
                        >

                    </div>

                </div>

            </section>


            <div class="submit-container">

                <button
                    type="submit"
                    class="analyze-btn"
                >
                    Analyze Risk →
                </button>

            </div>


        </form>

    </main>


    <script src="script.js"></script>

</body>

</html>
